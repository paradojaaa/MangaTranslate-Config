name: Vigilar servidores de MangaTranslate

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: Enviar un mensaje de prueba a Telegram
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor-providers
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar servidores y avisar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        run: python3 .github/scripts/check-providers.py

      - name: Guardar estado de los servidores
        run: |
          if git diff --quiet -- .github/provider-monitor-state.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/provider-monitor-state.json
          git commit -m "Actualizar estado de servidores"
          git push
